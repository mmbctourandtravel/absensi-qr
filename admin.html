<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Update IP Wi-Fi Kantor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); color: #333; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
        
        .container { width: 100%; max-width: 420px; background: #ffffff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); overflow: hidden; padding: 25px; text-align: center; }
        
        .header-brand { margin-bottom: 20px; }
        .logo-text { font-size: 13px; font-weight: 700; color: #2563eb; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 5px; }
        h1 { font-size: 18px; color: #1e293b; font-weight: 700; }

        .ip-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-size: 13px; color: #475569; }
        .ip-box b { color: #1e293b; font-size: 16px; display: block; margin-top: 5px; margin-bottom: 2px;}
        
        /* Style untuk Select Dropdown */
        .select-wifi { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; outline: none; transition: border-color 0.3s; }
        .select-wifi:focus { border-color: #2563eb; }

        .info-text { font-size: 12px; color: #64748b; margin-bottom: 15px; line-height: 1.5; }

        .btn-update { width: 100%; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
        .btn-update:hover { opacity: 0.9; transform: translateY(-2px); }

        #statusMsg { margin-top: 15px; font-size: 13px; font-weight: 600; }
        .success { color: #059669; }
        .error { color: #dc2626; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-brand">
            <div class="logo-text">MMBC Tour & Travel</div>
            <h1>Pembaruan IP Wi-Fi Kantor</h1>
        </div>

        <div class="ip-box">
            🌐 Jaringan Wi-Fi Terdeteksi:<br>
            <b id="wifiName" style="color: #2563eb;">Mendeteksi...</b>
            <span id="currentIp" style="font-size: 13px; color: #64748b; font-weight: bold;">Mencari IP...</span>
            
            <div style="margin-top: 18px; text-align: left; padding-top: 15px; border-top: 1px dashed #cbd5e1;">
                <label style="font-size: 12px; color: #64748b; font-weight: bold;">Pilih Wi-Fi yang akan diperbarui:</label>
                <select id="targetWifi" class="select-wifi">
                    <option value="basecamp">Basecamp MMBC</option>
                    <option value="megavision">Megavision</option>
                </select>
            </div>
        </div>

        <p class="info-text">
            ℹ️ Pastikan Anda sudah terhubung ke Wi-Fi yang dipilih (Basecamp / Megavision) sebelum menekan tombol di bawah.
        </p>

        <button class="btn-update" onclick="updateIpKantor()">
            🔄 Perbarui IP Wi-Fi Kantor Sekarang
        </button>

        <div id="statusMsg"></div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbzKcfMXWKhdLhRZKNNhxjFxPZu8Pcs4OTqYxchHS4Ua4geP1lkqjv91giu7kftktbmH/exec"; 
        let myIp = "";

        // 1. Dapatkan IP Publik
        fetch("https://api.ipify.org?format=json")
            .then(r => r.json())
            .then(data => {
                myIp = data.ip;
                document.getElementById("currentIp").innerText = "IP: " + myIp;
                document.getElementById("wifiName").innerText = "Mengecek status...";

                // 2. Cek apakah IP ini sudah ada di database kita
                fetch(API, {
                    method: "POST",
                    body: JSON.stringify({ action: "getWifiInfo", ip: myIp })
                })
                .then(r => r.json())
                .then(res => {
                    if(res.wifi && res.wifi !== myIp) {
                        // Jika terdaftar
                        document.getElementById("wifiName").innerText = res.wifi;
                        document.getElementById("wifiName").style.color = "#059669"; // Hijau
                        
                        // Otomatis ubah pilihan dropdown sesuai nama Wi-Fi
                        let select = document.getElementById("targetWifi");
                        for(let i = 0; i < select.options.length; i++) {
                            if(res.wifi.toLowerCase().includes(select.options[i].value)) {
                                select.selectedIndex = i;
                                break;
                            }
                        }
                    } else {
                        // Jika belum terdaftar
                        document.getElementById("wifiName").innerText = "⚠️ IP Baru (Belum Terdaftar)";
                        document.getElementById("wifiName").style.color = "#dc2626"; // Merah
                    }
                })
                .catch(err => {
                    document.getElementById("wifiName").innerText = "Gagal memuat nama Wi-Fi";
                });

            })
            .catch(err => {
                document.getElementById("currentIp").innerText = "Gagal mendeteksi IP";
                document.getElementById("wifiName").innerText = "Offline";
            });

        function updateIpKantor() {
            if (!myIp) {
                alert("IP belum terdeteksi, mohon tunggu sebentar...");
                return;
            }

            let msg = document.getElementById("statusMsg");
            msg.className = "";
            msg.innerText = "Sedang memperbarui IP Wi-Fi kantor...";

            let targetTerpilih = document.getElementById("targetWifi").value;

            fetch(API, {
                method: "POST",
                body: JSON.stringify({
                    action: "updateWifi",
                    ip: myIp,
                    target: targetTerpilih
                })
            })
            .then(r => r.json())
            .then(res => {
                if(res.sukses) {
                    msg.className = "success";
                    msg.innerText = "✅ " + res.pesan;
                    // Ubah nama di atas menjadi berhasil
                    document.getElementById("wifiName").innerText = targetTerpilih.toUpperCase();
                    document.getElementById("wifiName").style.color = "#059669";
                } else {
                    msg.className = "error";
                    msg.innerText = "❌ " + res.pesan;
                }
            })
            .catch(err => {
                msg.className = "error";
                msg.innerText = "❌ Terjadi kesalahan koneksi ke server.";
            });
        }
    </script>
</body>
</html>
