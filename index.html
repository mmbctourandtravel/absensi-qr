<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MMBC QR Attendance</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#eef3f8;
    font-family:Arial,sans-serif;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    min-height:100vh;

    padding:20px;

}

.container{

    width:380px;
    max-width:100%;

    background:#ffffff;

    border-radius:25px;

    padding:25px;

    box-shadow:0 15px 40px rgba(0,0,0,.15);

}

.logo{

    width:120px;
    margin:auto;

}

.logo img{

    width:100%;
    display:block;

}

h1{

    margin-top:20px;

    text-align:center;

    color:#1565c0;

    font-size:30px;

}

.subtitle{

    margin-top:10px;
    margin-bottom:25px;

    text-align:center;

    color:#777;

}

#reader{

    width:100%;
    min-height:320px;

    border-radius:20px;

    border:2px dashed #90caf9;

    background:#f8fbff;

}

#hasil{

  margin-top:10px;

  min-height:60px;

  padding:12px;

  border-radius:15px;

  background:#ffffff;

  border:1px solid #e4e9f2;

  box-shadow:0 8px 15px rgba(0,0,0,.08);

  display:flex;

  justify-content:center;

  align-items:center;

}
    .processing{

  background:#fff3cd !important;
  border:1px solid #ffe69c !important;
  color:#856404;

}

.success-box{

  background:#d1fae5 !important;
  border:1px solid #86efac !important;

}

.error-box{

  background:#fee2e2 !important;
  border:1px solid #fca5a5 !important;

}
.success{

    width:100%;

}

.success .icon{

    font-size:70px;

    margin-bottom:15px;

    animation:pop .35s ease;

}

.success .title{

    font-size:30px;

    font-weight:bold;

    color:#16a34a;

    margin-bottom:18px;

}

.success .nama{

    font-size:28px;

    font-weight:bold;

    color:#1565c0;

    margin-bottom:15px;

}

.success .jam{

    font-size:22px;

    color:#555;

}
    .error{

    width:100%;

}

.error .icon{

    font-size:70px;

    margin-bottom:15px;

}

.error .title{

    font-size:28px;

    color:#d32f2f;

    font-weight:bold;

    margin-bottom:15px;

}

.error .pesan{

    font-size:22px;

    color:#555;

}
  @keyframes pop{

0%{

transform:scale(.7);

opacity:0;

}

100%{

transform:scale(1);

opacity:1;

}

}  
 #clock{

    text-align:center;

    margin-bottom:20px;

}

#tanggal{

    color:#666;

    font-size:16px;

    margin-bottom:6px;

}

#jam{

    font-size:34px;

    font-weight:bold;

    color:#1565c0;

    letter-spacing:2px;

}   
.footer{

    margin-top:20px;

    text-align:center;

    color:#999;

    font-size:14px;

    width:100%;

    clear:both;

    display:block;

}
</style>

</head>

<body>

<div class="container">

<div class="logo">
  <img src="Logo.jpeg" alt="MMBC">
</div>

<h1>

ABSENSI QR

</h1>

<div class="subtitle">

MMBC TOUR & TRAVEL

</div>
<div id="clock">

  <div id="tanggal"></div>

  <div id="jam"></div>

</div>

<div id="hasil">
  Menunggu Scan...
</div>

<div id="reader"></div>
<div id="selfieArea" style="display:none;">

<video
    id="selfieVideo"
    autoplay
    playsinline
    style="
    width:100%;
    border-radius:15px;
    ">
</video>

<canvas
    id="selfieCanvas"
    style="display:none;">
</canvas>

<button
    id="btnSelfie"
    style="
    width:100%;
    margin-top:10px;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#1565c0;
    color:white;
    font-size:18px;
    cursor:pointer;
    ">
    📸 Ambil Selfie
</button>
</div>
</div>
<div class="footer">

Version 3.0 FINAL
</div>

<script>
function beep(){
    const audio = new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");
    audio.play().catch(e => console.log("Audio play blocked"));
}

function updateClock(){
    const now = new Date();
    const hari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
    const bulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
    
    document.getElementById("tanggal").innerHTML = hari[now.getDay()] + ", " + now.getDate() + " " + bulan[now.getMonth()] + " " + now.getFullYear();
    document.getElementById("jam").innerHTML = now.toLocaleTimeString("id-ID");
}

setInterval(updateClock,1000);
updateClock();

// Ambil IP Address pengunjung otomatis
let userIP = "";
fetch("https://api.ipify.org?format=json")
    .then(r => r.json())
    .then(data => { userIP = data.ip; })
    .catch(err => console.log("Gagal mengambil IP: ", err));

// URL Web App Apps Script (Pastikan ini yang paling baru dari hasil Deploy)
const API = "https://script.google.com/macros/s/AKfycbzKcfMXWKhdLhRZKNNhxjFxPZu8Pcs4OTqYxchHS4Ua4geP1lkqjv91giu7kftktbmH/exec";

const qr = new Html5Qrcode("reader");
let sedangProses = false;
let selfieStream = null;
let qrStaffId = "";

// Mulai Kamera QR
qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (decodedText) => {
        if (sedangProses) return;

        qrStaffId = decodedText;
        sedangProses = true;
        qr.pause(); // Pause kamera QR
        beep(); // Bunyi tit!

        document.getElementById("hasil").className = "processing";
        document.getElementById("hasil").innerHTML = "⏳ Memproses absensi...";

        // Cek Status ke Apps Script
        fetch(API, {
            method: "POST",
            body: JSON.stringify({ action: "cekStatus", id: decodedText })
        })
        .then(r => r.text())
        .then(text => {
            let res = JSON.parse(text);
            
            // 1. JIKA ABSEN MASUK (BUTUH SELFIE)
            if(res.status == "masuk"){
                document.getElementById("hasil").innerHTML = "📸 Silakan ambil selfie";
                qr.stop().then(() => {
                    document.getElementById("reader").style.display = "none"; // Sembunyikan kotak QR
                    bukaKameraSelfie();
                });
                return;
            }

            // 2. JIKA ABSEN PULANG
            if(res.status == "pulang"){
                document.getElementById("hasil").innerHTML = "⏳ Memproses absen pulang...";
                
                // Matikan dan Sembunyikan Kotak QR biar profesional
                qr.stop().catch(e => console.log(e));
                document.getElementById("reader").style.display = "none"; 

                fetch(API, {
                    method: "POST",
                    body: JSON.stringify({ action: "absen", id: qrStaffId, ip: userIP })
                })
                .then(r => r.text())
                .then(pulangText => {
                    let absenRes = JSON.parse(pulangText);
                    if(absenRes.sukses){
                        document.getElementById("hasil").className = "success-box";
                        document.getElementById("hasil").innerHTML = `
                        <div class="success">
                            <div class="icon">👋</div>
                            <div class="title">SAMPAI JUMPA</div>
                            <div class="nama">${absenRes.nama}</div>
                            <div class="ket">Absen Pulang Berhasil</div>
                        </div>`;
                    } else {
                        document.getElementById("hasil").className = "error-box";
                        document.getElementById("hasil").innerHTML = "❌ " + absenRes.pesan;
                    }
                    setTimeout(() => { location.reload(); }, 3500); // Otomatis refresh
                }).catch(err => {
                    document.getElementById("hasil").className = "error-box";
                    document.getElementById("hasil").innerHTML = "❌ ERROR : " + err.message;
                    setTimeout(() => { location.reload(); }, 3500);
                });
                return;
            }

            // 3. JIKA SUDAH ABSEN
            if(res.status == "sudah_absen"){
                document.getElementById("hasil").className = "error-box";
                document.getElementById("hasil").innerHTML = "❌ " + res.pesan;
                
                // Matikan dan Sembunyikan Kotak QR biar gak nge-freeze jelek
                qr.stop().catch(e => console.log(e));
                document.getElementById("reader").style.display = "none"; 
                
                setTimeout(() => { location.reload(); }, 3000); // Otomatis refresh
                return;
            }
        })
        .catch(err => {
            document.getElementById("hasil").className = "error-box";
            document.getElementById("hasil").innerHTML = "❌ CEK STATUS ERROR : " + err;
            setTimeout(() => { location.reload(); }, 3000);
        });
    },
    (errorMessage) => { /* Abaikan error scan frame kosong */ }
).catch(err => {
    document.getElementById("hasil").className = "error-box";
    document.getElementById("hasil").innerHTML = "❌ Gagal membuka kamera QR";
    sedangProses = false;
});

// Buka Kamera Depan (Selfie)
async function bukaKameraSelfie(){
    try{
        document.getElementById("selfieArea").style.display = "block";
        document.getElementById("btnSelfie").style.display = "block"; // Pastikan tombol muncul
        
        selfieStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" }
        });
        document.getElementById("selfieVideo").srcObject = selfieStream;
    }catch(err){
        alert("Kamera Selfie tidak dapat diakses: " + err);
    }
}

// Proses Jepret Selfie
document.getElementById("btnSelfie").addEventListener("click", function(){
    
    // UI/UX: Sembunyikan tombol biar gak ditekan 2 kali
    this.style.display = "none"; 

    const video = document.getElementById("selfieVideo");
    
    // UI/UX: Pause video seolah-olah difoto (efek jepret)
    video.pause(); 
    
    const canvas = document.getElementById("selfieCanvas");
    const ctx = canvas.getContext("2d");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const foto = canvas.toDataURL("image/jpeg", 0.8);
    
    document.getElementById("hasil").className = "processing";
    document.getElementById("hasil").innerHTML = "📤 Mengupload selfie...";

    // Kirim Foto ke Google Drive
    fetch(API, {
        method: "POST",
        body: JSON.stringify({ action: "uploadSelfie", id: qrStaffId, foto: foto })
    })
    .then(r => r.text())
    .then(text => {
        let hasil = JSON.parse(text);
        if(hasil.sukses){
            
            // Matikan Kamera Selfie karena sudah beres upload
            if(selfieStream){
                selfieStream.getTracks().forEach(track => track.stop());
                selfieStream = null;
            }
            video.srcObject = null;
            video.style.display = "none"; // Hilangkan kamera selfie

            document.getElementById("hasil").innerHTML = "⏳ Menyimpan absensi...";
            
            // Lanjut proses simpan absen masuk ke Sheet
            return fetch(API, {
                method: "POST",
                body: JSON.stringify({ action: "absen", id: qrStaffId, foto: hasil.url, ip: userIP })
            });
        } else {
            throw new Error("Upload selfie gagal");
        }
    })
    .then(r => r.text())
    .then(text => {
        let absenRes = JSON.parse(text);
        if(absenRes.sukses){
            document.getElementById("hasil").className = "success-box";
            document.getElementById("selfieArea").style.display = "none"; // Bersihkan area
            
            document.getElementById("hasil").innerHTML = `
            <div class="success">
                <div class="icon">✅</div>
                <div class="title">SELAMAT DATANG</div>
                <div class="nama">${absenRes.nama}</div>
                <div class="ket">Absen Masuk Berhasil</div>
            </div>`;
            
            setTimeout(() => { location.reload(); }, 3500); 

        } else {
            document.getElementById("hasil").className = "error-box";
            document.getElementById("hasil").innerHTML = "❌ " + absenRes.pesan;
            setTimeout(() => { location.reload(); }, 3500);
        }
    })
    .catch(err => {
        document.getElementById("hasil").className = "error-box";
        document.getElementById("hasil").innerHTML = "❌ ERROR : " + err.message;
        setTimeout(() => { location.reload(); }, 3500);
    });
});
</script>
</body>

</html>
