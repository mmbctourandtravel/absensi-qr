<style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #333; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        
        .nav-tabs { 
            display: flex; 
            width: 100%; 
            max-width: 600px; 
            background: #1e293b; 
            border: 1px solid #334155;
            border-radius: 14px; 
            padding: 6px; 
            margin-bottom: 15px; 
            gap: 6px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: max-width 0.3s;
        }
        .tab-btn { 
            flex: 1; 
            padding: 10px 6px; 
            text-align: center; 
            background: transparent; 
            border: none; 
            color: #94a3b8; 
            font-weight: 600; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            font-size: 12px; 
        }
        .tab-btn.active { 
            background: #2563eb; 
            color: #ffffff; 
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); 
        }

        .container { 
            width: 100%; 
            max-width: 600px; 
            background: #ffffff; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); 
            overflow: hidden; 
            display: none; 
            opacity: 0;
            transform: translateY(10px);
            transition: max-width 0.3s; 
            position: relative; 
        }
        .container.active { 
            display: block; 
            animation: fadeInContainer 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInContainer {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media screen and (min-width: 900px) {
            #tab-rekap.container.active, #tab-log.container.active, #tab-admin.container.active { max-width: 96% !important; }
            .nav-tabs { max-width: 96% !important; }
        }

        .header-brand { background: #f8fafc; padding: 15px 20px; text-align: center; border-bottom: 1px solid #e2e8f0; }
        .logo-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-bottom: 5px; }
        .logo-text { font-size: 12px; font-weight: 700; color: #2563eb; letter-spacing: 1px; text-transform: uppercase; }
        h1 { font-size: 18px; color: #1e293b; font-weight: 700; text-transform: uppercase; }

        .clock-box { background: #eff6ff; padding: 8px; text-align: center; font-size: 13px; font-weight: 600; color: #1d4ed8; border-bottom: 1px solid #dbeafe; }
        .wifi-info-box { background: #f0fdf4; color: #15803d; padding: 8px; font-size: 12px; font-weight: 600; text-align: center; border-bottom: 1px solid #dcfce7; }
        .instruction-sub { font-size: 12px; color: #475569; font-weight: 600; background: #f1f5f9; padding: 8px; text-align: center; border-bottom: 1px solid #e2e8f0; }

        .scanner-wrapper { padding: 15px; text-align: center; }
        #reader { width: 100% !important; border: none !important; border-radius: 12px; overflow: hidden; background: #000; }
        
        #fullScreenOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0f172a; display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 99999; padding: 25px; text-align: center; transition: background 0.4s ease;
        }
        #fullScreenOverlay.theme-masuk { background: linear-gradient(135deg, #bae6fd 0%, #38bdf8 100%) !important; }
        #fullScreenOverlay.theme-pulang { background: linear-gradient(135deg, #a7f3d0 0%, #34d399 100%) !important; }
        #fullScreenOverlay.theme-loading { background: rgba(15, 23, 42, 0.9) !important; backdrop-filter: blur(10px); }
        #fullScreenOverlay.error-bg { background: linear-gradient(135deg, #fecaca 0%, #f87171 100%) !important; }

        .overlay-card {
            background: #ffffff; width: 100%; max-width: 400px; padding: 30px 20px; border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25); display: flex; flex-direction: column; align-items: center;
            animation: scaleUp 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .overlay-icon { font-size: 56px; margin-bottom: 10px; animation: bounceIcon 0.6s infinite alternate; }
        .overlay-title { font-size: 18px; font-weight: 800; color: #0f172a; margin-bottom: 6px; text-transform: uppercase; }
        .overlay-name { font-size: 20px; font-weight: 700; color: #2563eb; margin: 6px 0; background: #f8fafc; padding: 6px 16px; border-radius: 30px; border: 1px solid #e2e8f0; width: 100%; }
        .overlay-time { font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 4px; }
        .overlay-wifi { font-size: 12px; color: #64748b; margin-bottom: 15px; font-weight: 500; }
        .overlay-msg-box { background: #f1f5f9; padding: 10px 14px; border-radius: 12px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 600; color: #334155; border: 1px solid #e2e8f0; }
        .waving-hand { display: inline-block; animation: wave 1.2s infinite; transform-origin: 70% 70%; font-size: 18px; }

        #selfieModal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000000;
            display: none; flex-direction: column; align-items: center; justify-content: space-between;
            z-index: 9999; padding: 25px 20px; color: white; text-align: center;
        }
        #selfieVideo { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; background: #000; }
        .selfie-header, .selfie-footer { position: relative; z-index: 2; width: 100%; max-width: 420px; background: rgba(15, 23, 42, 0.7); padding: 14px; border-radius: 16px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.15); }
        .btn-capture { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; border: none; padding: 14px 28px; border-radius: 35px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5); }

        @keyframes bounceIcon { from { transform: translateY(0); } to { transform: translateY(-6px); } }
        @keyframes wave { 0% { transform: rotate(0deg); } 20% { transform: rotate(14deg); } 40% { transform: rotate(-8deg); } 60% { transform: rotate(14deg); } 80% { transform: rotate(-4deg); } 100% { transform: rotate(0deg); } }
        @keyframes scaleUp { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .search-box-wrapper { padding: 12px 18px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
        .search-input { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 13px; outline: none; transition: 0.2s; background: #ffffff; }
        .search-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }

        .loading-rekap {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 350px;
            width: 100%;
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
        }

        .rekap-wrapper { 
            overflow: auto; 
            max-height: 65vh;
            min-height: 350px; 
            border: 1px solid #e2e8f0; 
            background: #ffffff; 
            position: relative; 
            padding: 0 !important; 
        }

        table.rekap-table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0; 
            font-size: 12px; 
            white-space: nowrap; 
        }

        table.rekap-table th, table.rekap-table td { 
            border-bottom: 1px solid #cbd5e1 !important; 
            border-right: 1px solid #cbd5e1 !important; 
            padding: 7px 7px; 
            text-align: center; 
            background: #ffffff; 
        }

        /* HEADER TABEL JADWAL (2 BARIS DIKUNCI KE ATAS DENGAN BENAR) */
        table.rekap-table th { 
            background: #0f172a !important; 
            color: #ffffff !important; 
            font-weight: 600; 
            letter-spacing: 0.4px; 
            position: sticky; 
            border-bottom: 1px solid #334155 !important;
            border-right: 1px solid #334155 !important;
        }
        table.rekap-table tr:nth-child(1) th { top: 0px; z-index: 30; }
        table.rekap-table tr:nth-child(2) th { top: 31px; z-index: 29; }

        /* TAB JADWAL: KOLOM NO & NAMA STICKY DI KIRI, SISA CUTI & TELAT IKUT BERGERAK BEBAS */
        table.rekap-table th:nth-child(1), table.rekap-table td:nth-child(1) { 
            width: 35px !important; min-width: 35px !important; max-width: 35px !important;
            position: sticky !important; left: 0px !important; z-index: 20; 
            background: #f8fafc !important; color: #475569; font-weight: 600;
        }
        table.rekap-table th:nth-child(2), table.rekap-table td:nth-child(2) { 
            width: 155px !important; min-width: 155px !important; max-width: 155px !important;
            position: sticky !important; left: 35px !important; z-index: 20; 
            background: #f8fafc !important; text-align: left !important; font-weight: 600; color: #1e293b;
            border-right: 2px solid #cbd5e1 !important;
        }
        
        table.rekap-table th:nth-child(3), table.rekap-table td:nth-child(3),
        table.rekap-table th:nth-child(4), table.rekap-table td:nth-child(4) {
            position: static !important;
            width: 65px !important; min-width: 65px !important;
        }

        /* TITIK PERTEMUAN SUDUT KIRI ATAS TABEL JADWAL */
        table.rekap-table tr:nth-child(1) th:nth-child(1), table.rekap-table tr:nth-child(2) th:nth-child(1) { z-index: 40 !important; background: #0f172a !important; left: 0px !important; top: 0px !important; }
        table.rekap-table tr:nth-child(1) th:nth-child(2), table.rekap-table tr:nth-child(2) th:nth-child(2) { z-index: 40 !important; background: #0f172a !important; left: 35px !important; top: 0px !important; border-right: 2px solid #334155 !important; }

        table.rekap-table tbody tr:hover td { background: #f8fafc !important; }
        table.rekap-table tbody tr:hover td:nth-child(-n+2) { background: #f1f5f9 !important; }
        table.rekap-table tbody tr.row-pembatas:hover td { background: #f1f5f9 !important; }

        /* --- STYLING TABEL LOG HARI INI (KOLOM NAMA YANG STICKY DI KIRI) --- */
        table.log-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; white-space: nowrap; }
        table.log-table th, table.log-table td { border: 1px solid #e2e8f0; padding: 10px 12px; background: #ffffff; text-align: center; }
        table.log-table th { background: #1e293b !important; color: #ffffff !important; position: sticky; top: 0; z-index: 10; } 
        
        /* Kolom No di Log (Tidak Sticky) */
        table.log-table th:nth-child(1), table.log-table td:nth-child(1) {
            width: 45px !important; min-width: 45px !important; text-align: center; color: #64748b; font-weight: 600;
            position: static !important; background: #ffffff !important;
        }
        table.log-table tr:hover td:nth-child(1) { background: #ffffff !important; }

        /* Kolom Nama di Log (STICKY DI KIRI DENGAN PRESISI) */
        table.log-table th:nth-child(2), table.log-table td:nth-child(2) {
            width: 160px !important; min-width: 160px !important; max-width: 160px !important;
            position: sticky !important; left: 0px !important; z-index: 5;
            background: #f8fafc !important; color: #1e293b; font-weight: 600; text-align: left !important;
            border-right: 2px solid #cbd5e1 !important;
        }
        table.log-table th:nth-child(2) { z-index: 20 !important; background: #1e293b !important; color: #ffffff !important; }
        table.log-table tbody tr:hover td:nth-child(2) { background: #f1f5f9 !important; }

        .badge-shift { display: inline-block; padding: 2px 5px; border-radius: 4px; font-weight: 600; font-size: 11px; text-align: center; min-width: 28px; }
        .badge-s1, .badge-s2 { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .badge-off { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .badge-cuti { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
        .badge-tlt { background: #fff7ed; color: #ea580c; border: 1px solid #fed7aa; }
    </style>
