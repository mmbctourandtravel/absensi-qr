<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi - MMBC Tour & Travel</title>
    <meta name="theme-color" content="#0f172a">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #333; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        
        .nav-tabs { display: flex; width: 100%; max-width: 600px; background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 6px; margin-bottom: 15px; gap: 6px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); }
        .tab-btn { flex: 1; padding: 10px 6px; text-align: center; background: transparent; border: none; color: #94a3b8; font-weight: 600; border-radius: 10px; cursor: pointer; transition: 0.3s; font-size: 12px; }
        .tab-btn.active { background: #2563eb; color: #ffffff; font-weight: bold; }

        .container { width: 100%; max-width: 600px; background: #ffffff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); display: none; transition: 0.3s; }
        .container.active { display: block; }

        .header-brand { background: #f8fafc; padding: 15px; text-align: center; border-bottom: 1px solid #e2e8f0; }
        .logo-img { width: 50px; height: 50px; border-radius: 50%; }
        .scanner-wrapper { padding: 15px; text-align: center; }
        #reader { width: 100% !important; border-radius: 12px; background: #000; }

        #fullScreenOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0f172a; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; padding: 25px; text-align: center; }
        .overlay-card { background: #ffffff; width: 100%; max-width: 400px; padding: 30px; border-radius: 24px; display: flex; flex-direction: column; align-items: center; }
        .btn-retry { margin-top: 15px; padding: 12px 24px; background: #ef4444; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        #selfieModal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; display: none; flex-direction: column; align-items: center; justify-content: space-between; z-index: 9999; padding: 25px; }
        #selfieVideo { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; }
        .selfie-ui { position: relative; z-index: 2; width: 100%; max-width: 420px; background: rgba(0,0,0,0.6); padding: 20px; border-radius: 16px; color: white; }
    </style>
</head>
<body>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('scanner', this)">📷 Scanner</button>
        <button class="tab-btn" onclick="switchTab('rekap', this)">📊 Jadwal</button>
        <button class="tab-btn" onclick="switchTab('log', this)">📋 Log</button>
    </div>

    <!-- MODAL SELFIE -->
    <div id="selfieModal">
        <video id="selfieVideo" autoplay playsinline></video>
        <div class="selfie-ui" style="margin-top: 20px;">
            <h3 id="selfieStaffName">Ambil Foto</h3>
        </div>
        <div class="selfie-ui" style="margin-bottom: 20px;">
            <button class="btn-capture" onclick="ambilFotoDanKirim()" style="width:100%; padding:15px; border-radius:30px; border:none; background:#2563eb; color:white; font-weight:bold;">📸 Ambil & Kirim</button>
        </div>
    </div>

    <!-- OVERLAY -->
    <div id="fullScreenOverlay">
        <div class="overlay-card" id="overlayCard">
            <div id="overlayContent"></div>
        </div>
    </div>

    <div id="tab-scanner" class="container active">
        <div class="header-brand"><img src="logo.png" class="logo-img"><h1>ABSENSI QR</h1></div>
        <div class="scanner-wrapper"><div id="reader"></div></div>
<!-- TOMBOL INSTAL DITARUH DI SINI -->
        <div id="installContainer" style="display:none; padding: 10px 20px 20px 20px; text-align: center;">
            <button id="btnInstall" style="background: #10b981; color: white; border: none; padding: 12px 25px; border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.4);">
                📲 Install Aplikasi Absensi
            </button>
        </div>
    </div>
    <!-- Container Tab lain (Rekap/Log) seperti kode sebelumnya -->
    <div id="tab-rekap" class="container">...</div>
    <div id="tab-log" class="container">...</div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbzKcfMXWKhdLhRZKNNhxjFxPZu8Pcs4OTqYxchHS4Ua4geP1lkqjv91giu7kftktbmH/exec";
        let activeStaffId = "";
        let streamSelfie = null;

        function ambilFotoDanKirim() {
            const video = document.getElementById("selfieVideo");
            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Watermark
            ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0, canvas.height - 110, canvas.width, 110);
            ctx.fillStyle = "#38bdf8"; ctx.font = "bold 22px Arial"; ctx.fillText("👤 " + (window.activeStaffNama || "Staff"), 20, canvas.height - 72);
            ctx.fillStyle = "#fff"; ctx.font = "15px Arial"; ctx.fillText("📅 " + new Date().toLocaleString(), 20, canvas.height - 44);
            ctx.fillText("📍 MMBC Tour & Travel", 20, canvas.height - 18);

            const base64Image = canvas.toDataURL("image/jpeg", 0.85);
            if (streamSelfie) streamSelfie.getTracks().forEach(t => t.stop());
            document.getElementById("selfieModal").style.display = "none";

            tampilkanOverlay("⏳", "Mengupload...", "Mohon tunggu...");

            fetch(API, { method: "POST", body: JSON.stringify({ action: "uploadSelfie", id: activeStaffId, foto: base64Image }) })
            .then(r => r.json())
            .then(res => {
                if (res.sukses) eksekusiAbsenFinal(res.url);
                else tampilkanPesanRetry("Gagal Upload", "Cek koneksi, coba lagi.", () => ambilFotoDanKirim());
            })
            .catch(() => tampilkanPesanRetry("Koneksi Error", "Cek jaringan, coba lagi.", () => ambilFotoDanKirim()));
        }

        function tampilkanPesanRetry(judul, pesan, retryCallback) {
            const overlay = document.getElementById("fullScreenOverlay");
            document.getElementById("overlayContent").innerHTML = `<h1>⚠️</h1><h3>${judul}</h3><p>${pesan}</p><button class="btn-retry" onclick="this.parentElement.parentElement.parentElement.style.display='none';">Tutup</button><button class="btn-retry" style="background:#2563eb" onclick="this.parentElement.parentElement.parentElement.style.display='none'; (${retryCallback.toString()})();">Coba Lagi</button>`;
            overlay.style.display = "flex";
        }

        function tampilkanOverlay(icon, title, msg) {
            document.getElementById("overlayContent").innerHTML = `<h1>${icon}</h1><h3>${title}</h3><p>${msg}</p>`;
            document.getElementById("fullScreenOverlay").style.display = "flex";
        }

        function eksekusiAbsenFinal(fotoUrl) {
            fetch(API, { method: "POST", body: JSON.stringify({ action: "absen", id: activeStaffId, ip: window.userIP || "", foto: fotoUrl }) })
            .then(r => r.json())
            .then(res => {
                if (res.sukses) tampilkanOverlay("✅", "Sukses", "Absen berhasil: " + res.nama);
                else tampilkanOverlay("❌", "Gagal", res.pesan);
                setTimeout(() => location.reload(), 3000);
            });
        }
        <script>
    // ... semua fungsi yang sudah ada ...
    
    // --- LOGIKA TOMBOL INSTAL PWA ---
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('installContainer').style.display = 'block';
    });

    document.getElementById('btnInstall').addEventListener('click', (e) => {
        document.getElementById('installContainer').style.display = 'none';
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                deferredPrompt = null;
            });
        }
    });

    window.addEventListener('appinstalled', (evt) => {
        document.getElementById('installContainer').style.display = 'none';
    });

    </script>
</body>
</html>
